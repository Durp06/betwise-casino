name: BetWise Casino CI

on:
  # Run on every push to every branch so collaborators see green/red as
  # they work, not only when they open a PR.
  push:
  # Also run on every PR to main so branch protection has a status to gate
  # on. Without this, the same commit may not produce a check_run that
  # branch protection can require.
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install lint tooling
        run: pip install ruff

      - name: Lint (ruff)
        # Lint the backend package from the project root so import paths line
        # up with how pytest runs.
        run: ruff check backend

      - name: Run backend tests
        working-directory: backend
        env:
          # Tests use in-memory SQLite + the dev-user bypass; no real Supabase/Anthropic needed.
          BETWISE_TEST_DB_URL: "sqlite+aiosqlite:///:memory:"
          BETWISE_DEV_USER_ID: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
        run: python -m pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    # Gold "pick one": a real end-to-end suite covering three distinct flows
    # (landing/onboarding, the main sit-bet-deal-play action, and an
    # unauthorized 401 edge). Playwright's webServer array boots the real
    # FastAPI backend (+ a no-bypass instance for the auth check) and the vite
    # dev frontend, then drives them in a headless browser. Runs alongside the
    # backend/frontend jobs so the whole pipeline must go green before deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: frontend
        env:
          # CI=true makes playwright.config start fresh servers (no reuse) and
          # retry flaky specs. The dev-auth bypass env the servers need is set
          # inside playwright.config.ts's webServer blocks, not here.
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  migrations:
    # Verify the real Postgres DDL in backend/migrations/*.sql actually applies on
    # a managed-Postgres-equivalent. The pytest suite builds the schema from the
    # ORM on in-memory SQLite, so the hand-written .sql (JSONB, BIGINT,
    # gen_random_uuid(), DO $$ blocks, CHECK/UNIQUE constraints, the FK to
    # auth.users) was previously only exercised at deploy time. This catches DDL
    # drift before it reaches prod.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Bootstrap the Supabase-managed auth schema
        # migration 001 FKs users.id -> auth.users(id), a table Supabase provides
        # but a vanilla Postgres does not. Stub it so the DDL applies; the FK
        # constraint itself is still created and verified.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d betwise -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS auth;" -c "CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);"

      - name: Apply migrations against Postgres
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/betwise"
        run: python -m backend.migrate

      - name: Re-run migrations (idempotency — must be a no-op)
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/betwise"
        run: python -m backend.migrate

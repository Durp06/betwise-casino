name: BetWise Casino CI

on:
  # Run on every push to every branch so collaborators see green/red as
  # they work, not only when they open a PR.
  push:
  # Also run on every PR to main so branch protection has a status to gate
  # on. Without this, the same commit may not produce a check_run that
  # branch protection can require.
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install lint tooling
        run: pip install ruff

      - name: Lint (ruff)
        # Lint the backend package from the project root so import paths line
        # up with how pytest runs.
        run: ruff check backend

      - name: Run backend tests
        working-directory: backend
        env:
          # Tests use in-memory SQLite + the dev-user bypass; no real Supabase/Anthropic needed.
          BETWISE_TEST_DB_URL: "sqlite+aiosqlite:///:memory:"
          BETWISE_DEV_USER_ID: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
        run: python -m pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    # Gold "pick one": a real end-to-end suite covering three distinct flows
    # (landing/onboarding, the main sit-bet-deal-play action, and an
    # unauthorized 401 edge). Playwright's webServer array boots the real
    # FastAPI backend (+ a no-bypass instance for the auth check) and the vite
    # dev frontend, then drives them in a headless browser. Runs alongside the
    # backend/frontend jobs so the whole pipeline must go green before deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: frontend
        env:
          # CI=true makes playwright.config start fresh servers (no reuse) and
          # retry flaky specs. The dev-auth bypass env the servers need is set
          # inside playwright.config.ts's webServer blocks, not here.
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
